<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strict In-Page Video Gallery</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ff4757;
        }
        
        /* Video Grid Layout */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
        }
        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #000;
        }
        .thumbnail-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 0, 0, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .play-button::after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            border-top: 9px solid transparent;
            border-bottom: 9px solid transparent;
            border-left: 15px solid white;
            margin-left: 3px;
        }
        .video-info {
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
        }
        .modal-wrapper {
            position: relative;
            width: 90%;
            max-width: 900px;
        }
        .modal-content {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
        }
        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Anti-Redirection Masks */
        /* Top Mask: Blocks Title & Share Button */
        .mask-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            z-index: 10;
            background: transparent;
        }
        /* Bottom-Right Mask: Blocks "Watch on YouTube" & Logo */
        .mask-bottom-right {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 160px;
            height: 50px;
            z-index: 10;
            background: transparent;
        }

        /* Custom In-Page Controls Bar */
        .custom-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e1e1e;
            padding: 10px 15px;
            border-radius: 0 0 8px 8px;
        }
        .custom-controls button {
            background: #ff4757;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .custom-controls button:hover {
            background: #ff6b81;
        }
        .close-btn {
            background: #333 !important;
        }
    </style>
</head>
<body>

    <div class="container">

            </div>
        </div>
    </div>

    <!-- Modal with Anti-Redirect Overlay Masks -->
    <div id="videoModal" class="modal">
        <div class="modal-wrapper">
            <div class="modal-content">
                <!-- Transparent Click Blockers -->
                <div class="mask-top"></div>
                <div class="mask-bottom-right"></div>
                
                <div id="player"></div>
            </div>
            <div class="custom-controls">
                <button id="togglePlayBtn" onclick="togglePlay()">Pause</button>
                <button class="close-btn" onclick="closePlayer()">Close Video</button>
            </div>
        </div>
    </div>

    <script>
        let player;
        let isPlaying = false;

        // Load YouTube IFrame API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function openPlayer(videoId) {
            document.getElementById('videoModal').style.display = 'flex';
            
            if (player) {
                player.loadVideoById(videoId);
            } else {
                player = new YT.Player('player', {
                    videoId: videoId,
                    playerVars: {
                        'autoplay': 1,
                        'controls': 1,
                        'modestbranding': 1,
                        'rel': 0,
                        'fs': 0, // Disable Fullscreen to prevent open in YouTube app
                        'disablekb': 1
                    },
                    events: {
                        'onStateChange': onPlayerStateChange
                    }
                });
            }
            isPlaying = true;
            document.getElementById('togglePlayBtn').innerText = 'Pause';
        }

        function togglePlay() {
            if (isPlaying) {
                player.pauseVideo();
                document.getElementById('togglePlayBtn').innerText = 'Play';
            } else {
                player.playVideo();
                document.getElementById('togglePlayBtn').innerText = 'Pause';
            }
            isPlaying = !isPlaying;
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('togglePlayBtn').innerText = 'Pause';
            } else if (event.data == YT.PlayerState.PAUSED) {
                isPlaying = false;
                document.getElementById('togglePlayBtn').innerText = 'Play';
            }
        }

        function closePlayer() {
            document.getElementById('videoModal').style.display = 'none';
            if (player) {
                player.stopVideo();
            }
        }
    </script>
</body>
</html>
