<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Playlist App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: #ffffff;
      padding: 20px;
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #ff0000;
    }

    /* Main Grid Layout */
    .playlist-container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Video Player Box */
    .player-box {
      background-color: #1f1f1f;
      border-radius: 12px;
      padding: 15px;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background-color: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .current-title {
      margin-top: 15px;
      font-size: 18px;
    }

    /* Songs Playlist Sidebar */
    .song-list {
      background-color: #1f1f1f;
      border-radius: 12px;
      padding: 15px;
      max-height: 500px;
      overflow-y: auto;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      background-color: #2a2a2a;
      transition: background 0.2s;
    }

    .song-item:hover {
      background-color: #383838;
    }

    .song-item img {
      width: 80px;
      height: 45px;
      border-radius: 4px;
      object-fit: cover;
    }

    .song-info h4 {
      font-size: 14px;
      line-height: 1.2;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .playlist-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <h2>My YouTube Video Player</h2>

  <div class="playlist-container">
    
    <!-- Left Side: Main Video Player -->
    <div class="player-box">
      <div class="video-wrapper">
        <!-- Aapka Naya Video Link Yahan Default Play Hoga -->
        <iframe 
          id="main-player" 
          src="https://www.youtube.com/embed/Ze3Jjvn4rYI?autoplay=1" 
          allow="autoplay; encrypted-media; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
      <h3 id="video-title" class="current-title">Playing: Live Stream / Song</h3>
    </div>

    <!-- Right Side: Songs List -->
    <div class="song-list">

      <!-- AAPKA DIYA HUA LINK -->
      <div class="song-item" onclick="playSong('Ze3Jjvn4rYI', 'My Selected Video (Live/Song)')">
        <img src="https://img.youtube.com/vi/Ze3Jjvn4rYI/hqdefault.jpg" alt="Thumbnail">
        <div class="song-info">
          <h4>My Selected Video</h4>
        </div>
      </div>

      <!-- Extra Demo Songs (Aap inhen badal sakte hain) -->
      <div class="song-item" onclick="playSong('kJQP7kiw5Fk', 'Despacito - Luis Fonsi')">
        <img src="https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg" alt="Thumbnail">
        <div class="song-info">
          <h4>Despacito</h4>
        </div>
      </div>

      <div class="song-item" onclick="playSong('JGwWNGJdvx8', 'Shape of You - Ed Sheeran')">
        <img src="https://img.youtube.com/vi/JGwWNGJdvx8/hqdefault.jpg" alt="Thumbnail">
        <div class="song-info">
          <h4>Shape of You</h4>
        </div>
      </div>

    </div>

  </div>

  <script>
    function playSong(videoId, title) {
      const player = document.getElementById('main-player');
      const titleElement = document.getElementById('video-title');

      // Video src change karke naya video play karein
      player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      titleElement.innerText = `Playing: ${title}`;
    }
  </script>

</body>
</html>
