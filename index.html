<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Web App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: #fff;
    }

    /* Header & Search Bar Bar */
    header {
      display: flex;
      justify-content: center;
      padding: 15px;
      background-color: #212121;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .search-box {
      display: flex;
      width: 100%;
      max-width: 600px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid #303030;
      border-radius: 20px 0 0 20px;
      background-color: #121212;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .search-box button {
      padding: 10px 20px;
      border: 1px solid #303030;
      border-left: none;
      border-radius: 0 20px 20px 0;
      background-color: #222222;
      color: #fff;
      cursor: pointer;
    }

    .search-box button:hover {
      background-color: #383838;
    }

    /* Layout */
    .container {
      display: flex;
      flex-direction: column;
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
      gap: 20px;
    }

    /* Video Player Section */
    #player-section {
      display: none;
      width: 100%;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      background-color: #000;
      border-radius: 12px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #video-title {
      margin-top: 10px;
      font-size: 18px;
    }

    /* Video List Section */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .video-card {
      cursor: pointer;
      background-color: #181818;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .video-card:hover {
      transform: scale(1.03);
    }

    .video-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .video-info {
      padding: 10px;
    }

    .video-info h4 {
      font-size: 14px;
      line-height: 1.3;
      margin-bottom: 5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-info p {
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <header>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search songs or videos...">
      <button onclick="searchVideos()">Search</button>
    </div>
  </header>

  <div class="container">
    <div id="player-section">
      <div class="video-container">
        <iframe id="youtube-player" allowfullscreen allow="autoplay"></iframe>
      </div>
      <h3 id="video-title"></h3>
    </div>

    <div class="results-grid" id="results-grid"></div>
  </div>

  <script>
    // ⚠️ APNI YOUTUBE DATA API KEY YAHAN DALEIN
    const API_KEY = 'YOUR_YOUTUBE_API_KEY';

    async function searchVideos() {
      const query = document.getElementById('search-input').value;
      if (!query) return;

      if (API_KEY === 'YOUR_YOUTUBE_API_KEY') {
        alert('Please replace YOUR_YOUTUBE_API_KEY with your actual YouTube Data API v3 key in index.html!');
        return;
      }

      const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.items) {
          displayResults(data.items);
        } else {
          console.error('Error fetching data:', data);
        }
      } catch (error) {
        console.error('Fetch Error:', error);
      }
    }

    function displayResults(videos) {
      const resultsGrid = document.getElementById('results-grid');
      resultsGrid.innerHTML = '';

      videos.forEach(video => {
        const videoId = video.id.videoId;
        const title = video.snippet.title;
        const thumbnail = video.snippet.thumbnails.medium.url;
        const channelName = video.snippet.channelTitle;

        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => playVideo(videoId, title);

        card.innerHTML = `
          <img src="${thumbnail}" alt="${title}">
          <div class="video-info">
            <h4>${title}</h4>
            <p>${channelName}</p>
          </div>
        `;

        resultsGrid.appendChild(card);
      });
    }

    function playVideo(videoId, title) {
      const playerSection = document.getElementById('player-section');
      const iframe = document.getElementById('youtube-player');
      const titleElement = document.getElementById('video-title');

      // Video load aur play karein
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      titleElement.innerText = title;
      playerSection.style.display = 'block';

      // Player screen tak smooth scroll karein
      playerSection.scrollIntoView({ behavior: 'smooth' });
    }

    // Enter key dabane par bhi search trigger ho
    document.getElementById('search-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        searchVideos();
      }
    });
  </script>

</body>
</html>
