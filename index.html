<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My YouTube Video Collection</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #ff0000;
            margin-bottom: 30px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .video-card {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .links-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #ff0000;
        }
        .links-section h2 {
            margin-top: 0;
            color: #333;
        }
        .links-list {
            list-style: none;
            padding: 0;
        }
        .links-list li {
            margin-bottom: 10px;
            padding: 8px;
            background: #fff;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .links-list a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
            word-break: break-all;
        }
        .links-list a:hover {
            text-decoration: underline;
            color: #ff0000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YouTube Videos</h1>

        <!-- Embedded Players Section -->
        <div class="video-grid">
            <div class="video-card"><div class="video-container"><iframe src="https://www.youtube.com/embed/f7n0TzjPhT4" allowfullscreen></iframe></div></div>
            <div class="video-card"><div class="video-container"><iframe src="https://www.youtube.com/embed/6BDkp4NgTkU" allowfullscreen></iframe></div></div>

            <div class="video-card"><div class="video-container"><iframe src="https://www.youtube.com/embed/gkSO4JmJ8L4" allowfullscreen></iframe></div></div>
            <div class="video-card"><div class="video-container"><iframe src="https://www.youtube.com/embed/caRlpUytqto" allowfullscreen></iframe></div></div>
            <div class="video-card"><div class="video-container"><iframe src="https://www.youtube.com/embed/e5LShHAE03A" allowfullscreen></iframe></div></div>

</body>
