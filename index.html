<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player Interface with Audio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        .sidebar { width: 240px; background-color: #000000; padding: 24px 12px; display: flex; flex-direction: column; gap: 15px; }
        .sidebar h2 { font-size: 22px; padding-left: 12px; margin-bottom: 20px; color: #ffffff; }
        .nav-link { padding: 10px 12px; color: #b3b3b3; text-decoration: none; font-size: 14px; font-weight: 600; border-radius: 4px; cursor: pointer; transition: color 0.3s; }
        .nav-link:hover { color: #ffffff; }

        .content-area { flex: 1; background: linear-gradient(to bottom, #2b2b2b, #121212); padding: 24px; overflow-y: auto; }
        .header { margin-bottom: 30px; }
        .card-container { display: flex; gap: 20px; flex-wrap: wrap; }
        
        .card { background-color: #181818; padding: 16px; border-radius: 8px; width: 180px; cursor: pointer; transition: background-color 0.3s; }
        .card:hover { background-color: #282828; }
        .card-img { width: 100%; height: 150px; background-color: #333; border-radius: 4px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card h3 { font-size: 15px; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card p { font-size: 13px; color: #b3b3b3; }

        .player { height: 90px; background-color: #181818; border-top: 1px solid #282828; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .player-info { width: 25%; }
        .player-info h4 { font-size: 14px; margin-bottom: 4px; }
        
        .player-center { width: 50%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .player-controls { display: flex; align-items: center; gap: 20px; }
        .ctrl-btn { background: none; border: none; color: #b3b3b3; font-size: 16px; cursor: pointer; }
        .ctrl-btn:hover { color: #ffffff; }
        .play-btn { width: 36px; height: 36px; background-color: #ffffff; border: none; border-radius: 50%; color: #000000; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.1s; }
        .play-btn:hover { transform: scale(1.05); }

        .progress-container { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 500px; }
        .time-text { font-size: 11px; color: #b3b3b3; width: 35px; text-align: center; }
        .progress-bar-bg { flex: 1; height: 4px; background-color: #5e5e5e; border-radius: 2px; cursor: pointer; position: relative; }
        .progress-bar-fill { height: 100%; width: 0%; background-color: #1db954; border-radius: 2px; }

        .extra-controls { width: 25%; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
        .volume-slider { width: 80px; accent-color: #1db954; cursor: pointer; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <h2>🎵 MusicApp</h2>
            <div class="nav-link">🏠 Home</div>
            <div class="nav-link">🔍 Search</div>
            <div class="nav-link">📚 Your Library</div>
        </div>

        <div class="content-area">
            <div class="header">
                <h2>Good afternoon</h2>
            </div>
            
            <div class="card-container">
                <!-- Song Card 1 -->
                <div class="card" 
                     data-song-src="song.mp3" 
                     data-song-title="Synthwave Beats" 
                     data-song-artist="SoundHelix 1">
                    <div class="card-img" style="background: linear-gradient(45deg, #ff416c, #ff4b2b);"></div>
                    <h3>Synthwave Beats</h3>
                    <p>SoundHelix 1</p>
                </div>

                <!-- Song Card 2 -->
                <div class="card" 
                     data-song-src="song.mp3" 
                     data-song-title="Ambient Chill" 
                     data-song-artist="SoundHelix 2">
                    <div class="card-img" style="background: linear-gradient(45deg, #1cb5e0, #000046);"></div>
                    <h3>Ambient Chill</h3>
                    <p>SoundHelix 2</p>
                </div>

                <!-- Song Card 3 -->
                <div class="card" 
                     data-song-src="song.mp3" 
                     data-song-title="Acoustic Groove" 
                     data-song-artist="SoundHelix 3">
                    <div class="card-img" style="background: linear-gradient(45deg, #11998e, #38ef7d);"></div>
                    <h3>Acoustic Groove</h3>
                    <p>SoundHelix 3</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden HTML5 Audio Element -->
    <audio id="audioPlayer" src="song.mp3"></audio>

    <!-- Bottom Player Bar -->
    <div class="player">
        <div class="player-info">
            <h4 id="trackTitle">Synthwave Beats</h4>
            <p id="trackArtist" style="font-size: 12px; color: #b3b3b3;">SoundHelix 1</p>
        </div>
        
        <div class="player-center">
            <div class="player-controls">
                <button class="ctrl-btn" id="prevBtn">⏮</button>
                <button class="play-btn" id="playPauseBtn">▶</button>
                <button class="ctrl-btn" id="nextBtn">⏭</button>
            </div>
            <div class="progress-container">
                <span class="time-text" id="currentTime">0:00</span>
                <div class="progress-bar-bg" id="progressBg">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <span class="time-text" id="duration">0:00</span>
            </div>
        </div>

        <div class="extra-controls">
            <span style="font-size: 12px; color: #b3b3b3;">🔊</span>
            <input type="range" class="volume-slider" id="volumeControl" min="0" max="1" step="0.01" value="0.7">
        </div>
    </div>

    <script>
        // DOM Elements
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playPauseBtn');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const currentTimeText = document.getElementById('currentTime');
        const durationText = document.getElementById('duration');
        const progressFill = document.getElementById('progressFill');
        const progressBg = document.getElementById('progressBg');
        const volumeControl = document.getElementById('volumeControl');
        const cards = document.querySelectorAll('.card');

        // Play/Pause Toggle
        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.innerHTML = '⏸';
            } else {
                audio.pause();
                playBtn.innerHTML = '▶';
            }
        }

        playBtn.addEventListener('click', togglePlay);

        // Click Card to Play Specific Song
        cards.forEach(card => {
            card.addEventListener('click', function() {
                const songSrc = this.getAttribute('data-song-src');
                const title = this.getAttribute('data-song-title');
                const artist = this.getAttribute('data-song-artist');

                audio.src = songSrc;
                trackTitle.innerText = title;
                trackArtist.innerText = artist;

                audio.play();
                playBtn.innerHTML = '⏸';
            });
        });

        // Time Update for Progress Bar
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${progressPercent}%`;

                // Format Time (MM:SS)
                currentTimeText.innerText = formatTime(audio.currentTime);
                durationText.innerText = formatTime(audio.duration);
            }
        });

        // Seek Audio on Progress Bar Click
        progressBg.addEventListener('click', (e) => {
            const width = progressBg.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;

            if (duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        });

        // Volume Control
        volumeControl.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // Time Formatter Utility
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
