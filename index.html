<!DOCTYPE html>

    <title>In-Page Video Player Gallery</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ff4757;
        }
        
        /* Video Grid Layout */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
        }
        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
        }
        .thumbnail-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 0, 0, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .play-button::after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            border-top: 9px solid transparent;
            border-bottom: 9px solid transparent;
            border-left: 15px solid white;
            margin-left: 3px;
        }
        .video-info {
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }

        /* Modal (Popup Player) Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            position: relative;
            width: 90%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-btn:hover {
            color: #ff4757;
        }
    </style>
</head>

    <!-- Modal for Video Player -->
    <div id="videoModal" class="modal" onclick="closePlayer(event)">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayerDirect()">&times;</span>
            <iframe id="playerIframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function openPlayer(videoId) {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('playerIframe');
            
            // Set autoplay URL
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
            modal.style.display = 'flex';
        }

        function closePlayerDirect() {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('playerIframe');
            
            modal.style.display = 'none';
            iframe.src = ''; // Stop video on close
        }

        function closePlayer(event) {
            // Close when clicking outside the video container
            if (event.target.id === 'videoModal') {
                closePlayerDirect();
            }
        }
    </script>
